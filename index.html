<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro studenti</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><strong>Registro studenti</strong><small>Materie · Esercitazioni · Esami</small></div><div id="account"></div></header>
<section id="access" class="card access"><h1 id="accessTitle">Configurazione del portale</h1><p id="accessText">Caricamento…</p><pre id="uid"></pre><form id="passwordForm" hidden><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="4096"><button id="login" type="submit">Accedi</button></form><button id="retry" hidden>Riprova</button></section>
<div id="workspace" hidden><aside><h2>Le tue materie</h2><nav id="subjects"></nav><button id="addCourse">＋ Materia</button></aside><main><nav id="nav"></nav><h1 id="title"></h1><div id="years"></div><section id="content"></section><footer><span id="status" role="status"></span><div><button id="reload">Aggiorna dal cloud</button><button id="backup">Scarica backup</button><button id="restore">Ripristina backup</button><input id="file" type="file" accept=".json,application/json" hidden></div></footer></main></div>
<p id="error" role="alert"></p><dialog id="dialog"><form id="form"><h2 id="formTitle"></h2><div id="fields"></div><p id="formError" role="alert"></p><div class="actions"><button type="button" id="cancel">Annulla</button><button type="submit" class="primary">Salva</button></div></form></dialog>
<script src="firebase-config.js"></script><script src="cloud.js"></script><script src="app.js"></script></body></html>
